[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro-retime"
version = "0.1.0"
description = "Convert GoPro recordings to another frame rate while reproducing the camera's native file structure"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gopro-retime = "gopro_retime.cli:main"

[tool.setuptools.packages.find]
include = ["gopro_retime*"]
